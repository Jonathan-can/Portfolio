<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Tableau de suivi — Jonathan CANEVET</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #080c14; }
        iframe {
            display: block;
            width: calc(100% / 0.75);
            height: calc(100vh / 0.75);
            border: none;
            transform: scale(0.75);
            transform-origin: top left;
        }
    </style>
</head>
<body>
    <iframe
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQE4FWYpZH98bLOcmzlUB6aYqsOTjumrofCGBKxlsAvhjg9sGBeneFa0eH8Od14qw/pubhtml"
        title="Tableau de suivi"
        frameborder="0"
        scrolling="yes"
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox"
        allowfullscreen>
    </iframe>
</body>
</html>
